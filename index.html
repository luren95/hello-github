<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello GitHub</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f8;
    color: #171717;
    font-family: "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    padding: 32px 40px;
    background: #fff;
    border: 1px solid rgba(23, 23, 23, 0.12);
    border-radius: 12px;
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
  p { margin: 0; font-size: 14px; color: #52525b; }
  .tag {
    display: inline-block;
    margin-top: 20px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #E5EAFF;
    color: #1A1759;
    font-size: 12px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello GitHub</h1>
    <p>这是我的第一个页面，通过分支和 Pull Request 推送上来。</p>
    <span class="tag">luren95 / hello-github</span>
  </div>
</body>
</html>
